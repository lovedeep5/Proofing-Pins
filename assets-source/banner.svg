<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <!-- Background gradient: deep slate → WP brand blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0b1224"/>
      <stop offset="55%" stop-color="#152347"/>
      <stop offset="100%" stop-color="#1d3a72"/>
    </linearGradient>

    <!-- Soft cyan glow behind the mockup -->
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.55">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle dot grid overlay -->
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>

    <!-- Drop shadow for the mocked browser card -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Drop shadow for the pin marker -->
    <filter id="pinShadow" x="-50%" y="-30%" width="200%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Reusable pin shape: red teardrop, white ring, numbered -->
    <symbol id="pin" viewBox="0 0 50 64">
      <path d="M25 2 C 6 2 -3 22 7 38 L 25 62 L 43 38 C 53 22 44 2 25 2 Z"
            fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
      <circle cx="25" cy="22" r="9" fill="#ffffff"/>
    </symbol>
  </defs>

  <!-- Background layers -->
  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#dots)"/>
  <rect width="1544" height="500" fill="url(#glow)"/>

  <!-- Decorative accent bar -->
  <rect x="80" y="80" width="50" height="4" rx="2" fill="#3b82f6"/>

  <!-- LEFT: title + subtitle + feature bullets -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Brand line -->
    <text x="80" y="120" font-size="18" font-weight="600" letter-spacing="3" fill="#7dd3fc">
      WORDPRESS PLUGIN
    </text>

    <!-- Title -->
    <text x="80" y="195" font-size="78" font-weight="800" letter-spacing="-2" fill="#ffffff">
      Proofing Pins
    </text>

    <!-- Tagline -->
    <text x="80" y="248" font-size="26" font-weight="400" fill="#cbd5e1">
      Pin-point client feedback on any page,
    </text>
    <text x="80" y="282" font-size="26" font-weight="400" fill="#cbd5e1">
      with screenshots baked into every comment.
    </text>

    <!-- Feature bullets -->
    <g transform="translate(80, 340)">
      <g>
        <circle cx="8" cy="8" r="8" fill="#10b981"/>
        <text x="30" y="14" font-size="20" font-weight="500" fill="#e2e8f0">
          Click-to-pin with auto screenshot capture
        </text>
      </g>
      <g transform="translate(0, 38)">
        <circle cx="8" cy="8" r="8" fill="#6366f1"/>
        <text x="30" y="14" font-size="20" font-weight="500" fill="#e2e8f0">
          AI suggestions (bring your own key)
        </text>
      </g>
      <g transform="translate(540, 0)">
        <circle cx="8" cy="8" r="8" fill="#f59e0b"/>
        <text x="30" y="14" font-size="20" font-weight="500" fill="#e2e8f0">
          1-click Apply for Elementor widgets
        </text>
      </g>
      <g transform="translate(540, 38)">
        <circle cx="8" cy="8" r="8" fill="#a855f7"/>
        <text x="30" y="14" font-size="20" font-weight="500" fill="#e2e8f0">
          Microsoft Teams notifications
        </text>
      </g>
    </g>
  </g>

  <!-- RIGHT: browser-window mockup -->
  <g transform="translate(900, 80)" filter="url(#cardShadow)">
    <!-- Window body -->
    <rect x="0" y="0" width="580" height="340" rx="16" fill="#ffffff"/>

    <!-- Title bar -->
    <path d="M0 16 a16 16 0 0 1 16 -16 h548 a16 16 0 0 1 16 16 v24 h-580 z" fill="#f1f5f9"/>
    <circle cx="22" cy="20" r="6" fill="#ef4444"/>
    <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="66" cy="20" r="6" fill="#10b981"/>
    <rect x="110" y="10" width="380" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="125" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace"
          font-size="12" fill="#94a3b8">yoursite.com/landing</text>

    <!-- Page content -->
    <rect x="40"  y="70"  width="320" height="22" rx="4" fill="#0f172a"/>
    <rect x="40"  y="104" width="240" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="40"  y="124" width="260" height="10" rx="3" fill="#cbd5e1"/>

    <!-- Two image placeholders -->
    <rect x="40"  y="158" width="170" height="120" rx="10" fill="#e2e8f0"/>
    <rect x="225" y="158" width="170" height="120" rx="10" fill="#e2e8f0"/>
    <!-- little image sun -->
    <circle cx="80"  cy="195" r="12" fill="#fbbf24"/>
    <path d="M55 240 L95 200 L125 230 L160 195 L195 240 Z" fill="#94a3b8" opacity="0.7"/>
    <circle cx="265" cy="195" r="12" fill="#fbbf24"/>
    <path d="M240 240 L280 200 L310 230 L345 195 L380 240 Z" fill="#94a3b8" opacity="0.7"/>

    <!-- The pin (sits on the second image, like the real plugin would render it) -->
    <g transform="translate(290, 168)" filter="url(#pinShadow)">
      <use href="#pin" width="42" height="54"/>
      <text x="21" y="29" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" font-weight="700" fill="#ef4444">1</text>
    </g>

    <!-- Comment thread popover -->
    <g transform="translate(410, 158)" filter="url(#pinShadow)">
      <!-- bubble tail -->
      <path d="M0 30 L -16 42 L 0 54 Z" fill="#ffffff"/>
      <rect x="0" y="0" width="200" height="170" rx="14" fill="#ffffff"/>
      <!-- avatar -->
      <circle cx="24" cy="24" r="14" fill="#8b5cf6"/>
      <text x="24" y="29" text-anchor="middle"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="13" font-weight="700" fill="#ffffff">L</text>
      <!-- author + time -->
      <text x="48" y="22"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="12" font-weight="700" fill="#0f172a">Lovedeep</text>
      <text x="48" y="36"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="10" fill="#94a3b8">just now</text>
      <!-- comment text lines -->
      <rect x="20" y="58"  width="160" height="8" rx="2" fill="#cbd5e1"/>
      <rect x="20" y="74"  width="140" height="8" rx="2" fill="#cbd5e1"/>
      <rect x="20" y="90"  width="120" height="8" rx="2" fill="#cbd5e1"/>
      <!-- status chip -->
      <rect x="20" y="118" width="62" height="22" rx="11" fill="#fee2e2"/>
      <circle cx="32" cy="129" r="4" fill="#ef4444"/>
      <text x="42" y="133"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="11" font-weight="600" fill="#991b1b">Open</text>
      <!-- reply input -->
      <rect x="20" y="148" width="160" height="12" rx="6" fill="#f1f5f9"/>
    </g>
  </g>
</svg>
